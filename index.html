<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqui Alpino Pro ⛷️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #d2e4f7;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #uiContainer {
            display: flex;
            justify-content: space-between;
            width: 800px;
            max-width: 100%;
            padding: 10px 15px;
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }
        #gameCanvas {
            background: #f7f9fa;
            border: 4px solid #1a252f;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            display: block;
            max-width: 100%;
        }
        #gameOverScreen {
            display: none;
            position: absolute;
            background: rgba(255, 255, 255, 0.96);
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 2px solid #e74c3c;
            z-index: 20;
        }
        #gameOverScreen h1 {
            color: #c0392b;
            margin-bottom: 10px;
            font-size: 32px;
        }
        #gameOverScreen p {
            font-size: 18px;
            color: #34495e;
            margin-bottom: 20px;
        }
        #restartBtn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #restartBtn:hover {
            background-color: #219653;
            transform: translateY(-2px);
        }
        .controls-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #556270;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="uiContainer">
        <div>Distância: <span id="score">0</span>m</div>
        <div>Velocidade: <span id="speedDisplay">40</span> km/h</div>
    </div>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="gameOverScreen">
        <h1>Acidente na Pista! 💥</h1>
        <p>Você bateu nos pinheiros.</p>
        <p>Percurso Total: <span id="finalScore">0</span> metros</p>
        <button id="restartBtn">Jogar Novamente</button>
    </div>

    <div class="controls-hint">Use as setas ⬅️ ➡️ do teclado ou toque nas laterais da tela.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const speedDisplayElement = document.getElementById("speedDisplay");
        const finalScoreElement = document.getElementById("finalScore");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const restartBtn = document.getElementById("restartBtn");

        // Física e Jogador
        let player = {
            x: canvas.width / 2,
            y: 120,
            width: 24,
            height: 38,
            vx: 0,
            maxSpeed: 7,
            friction: 0.85,
            accel: 0.6,
            angle: 0
        };

        let obstacles = [];
        let skiTracks = [];   
        let snowParticles = [];
        let leavesParticles = []; // Partículas de folhas na batida
        let score = 0;
        let gameActive = true;
        let worldSpeed = 4.5;
        let maxWorldSpeed = 12;
        let spawnRate = 0.04;
        let keys = {};

        // Linhas de vento/neve de fundo
        for(let i = 0; i < 20; i++) {
            snowParticles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 30 + 10,
                speed: Math.random() * 4 + 4
            });
        }

        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        // Toque Celular
        window.addEventListener("touchstart", (e) => {
            const touchX = e.touches[0].clientX;
            if (touchX < window.innerWidth / 2) keys["ArrowLeft"] = true;
            else keys["ArrowRight"] = true;
        });
        window.addEventListener("touchend", () => {
            keys["ArrowLeft"] = false;
            keys["ArrowRight"] = false;
        });

        restartBtn.addEventListener("click", () => {
            player.x = canvas.width / 2;
            player.vx = 0;
            player.angle = 0;
            obstacles = [];
            skiTracks = [];
            leavesParticles = [];
            score = 0;
            worldSpeed = 4.5;
            gameActive = true;
            gameOverScreen.style.display = "none";
            scoreElement.innerText = score;
            gameLoop();
        });

        function spawnObstacle() {
            if (Math.random() < spawnRate) {
                let size = Math.floor(Math.random() * 20) + 35;
                obstacles.push({
                    x: Math.random() * (canvas.width - size),
                    y: canvas.height + 50,
                    width: size,
                    height: size * 1.3,
                    shake: 0 // Usado na animação de colisão
                });
            }
        }

        function createExplosion(x, y) {
            // Cria folhas voando ao colidir
            for (let i = 0; i < 15; i++) {
                leavesParticles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - 3,
                    radius: Math.random() * 4 + 2,
                    alpha: 1
                });
            }
        }

        function drawBackgroundAndTracks() {
            // Desenha e move as linhas de vento (Animação de velocidade)
            ctx.strokeStyle = "rgba(220, 235, 245, 0.8)";
            ctx.lineWidth = 2;
            snowParticles.forEach(p => {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x, p.y - p.length);
                ctx.stroke();
                
                p.y -= worldSpeed * 1.2;
                if (p.y < 0) {
                    p.y = canvas.height + p.length;
                    p.x = Math.random() * canvas.width;
                }
            });

            // Renderiza e esmaece os rastros de esqui
            ctx.strokeStyle = "rgba(200, 215, 230, 0.4)";
            ctx.lineWidth = 3;
            skiTracks.forEach(t => {
                ctx.beginPath();
                ctx.moveTo(t.x1, t.y);
                ctx.lineTo(t.x1, t.y - worldSpeed);
                ctx.moveTo(t.x2, t.y);
                ctx.lineTo(t.x2, t.y - worldSpeed);
                ctx.stroke();
                t.y -= worldSpeed;
            });
            skiTracks = skiTracks.filter(t => t.y > 0);
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle); // Animação de inclinação lateral nas curvas

            // Sombra do jogador
            ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
            ctx.beginPath();
            ctx.ellipse(0, 12, 10, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Esquis
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(-7, -15, 3, 32);
            ctx.fillRect(4, -15, 3, 32);

            // Corpo / Jaqueta
            ctx.fillStyle = "#1b3a4b"; 
            ctx.fillRect(-5, -6, 10, 16);

            // Braços/Bastões
            ctx.strokeStyle = "#95a5a6";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-7, 2); ctx.lineTo(-10, 14);
            ctx.moveTo(7, 2); ctx.lineTo(12, 14);
            ctx.stroke();

            // Capacete
            ctx.fillStyle = "#f1c40f";
            ctx.beginPath();
            ctx.arc(0, -6, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawTree(obs) {
            ctx.save();
            // Animação de tremor na batida
            if (obs.shake > 0) {
                ctx.translate((Math.random() - 0.5) * obs.shake, 0);
                obs.shake *= 0.9;
            }

            // Tronco
            ctx.fillStyle = "#5c4033";
            ctx.fillRect(obs.x + (obs.width / 2) - 4, obs.y + obs.height - 12, 8, 14);

            // Folhagem em camadas degradê
            let layers = [
                { h: obs.height * 0.7, w: obs.width, c: "#1b4d3e" },
                { h: obs.height * 0.4, w: obs.width * 0.75, c: "#1f5f48" },
                { h: 0, w: obs.width * 0.5, c: "#277454" }
            ];

            layers.forEach(l => {
                ctx.fillStyle = l.c;
                ctx.beginPath();
                ctx.moveTo(obs.x + obs.width / 2, obs.y + l.h);
                ctx.lineTo(obs.x + (obs.width / 2) - (l.w / 2), obs.y + l.h + (obs.height * 0.45));
                ctx.lineTo(obs.x + (obs.width / 2) + (l.w / 2), obs.y + l.h + (obs.height * 0.45));
                ctx.closePath();
                ctx.fill();
            });
            ctx.restore();
        }

        function drawParticles() {
            // Atualiza e desenha partículas de folhas da colisão
            leavesParticles.forEach((p, index) => {
                ctx.fillStyle = `rgba(39, 116, 84, ${p.alpha})`;
