<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Esqui ⛷️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #e6f2ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #scoreBoard {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            z-index: 10;
        }
        #gameCanvas {
            background: #ffffff;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            display: block;
            max-width: 100%;
        }
        #gameOverScreen {
            display: none;
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 20;
        }
        #gameOverScreen h1 {
            color: #d9534f;
            margin-bottom: 10px;
        }
        #gameOverScreen p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        #restartBtn {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #restartBtn:hover {
            background-color: #0056b3;
        }
        .controls-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="scoreBoard">Pontos: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <div id="gameOverScreen">
        <h1>Fim de Jogo! 💥</h1>
        <p>Você bateu em uma árvore.</p>
        <p>Pontuação Final: <span id="finalScore">0</span></p>
        <button id="restartBtn">Jogar Novamente</button>
    </div>

    <div class="controls-hint">Use as setas ⬅️ ➡️ ou toque nas laterais da tela para mover.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const finalScoreElement = document.getElementById("finalScore");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const restartBtn = document.getElementById("restartBtn");

        // Configurações do jogo
        let player = {
            x: canvas.width / 2 - 15,
            y: 100,
            width: 30,
            height: 35,
            speed: 5
        };

        let obstacles = [];
        let score = 0;
        let gameActive = true;
        let obstacleSpeed = 4;
        let spawnRate = 0.03; // Chance de surgir um obstáculo por frame
        let keys = {};

        // Captura de comandos do teclado
        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        // Suporte para telas de toque (celular)
        window.addEventListener("touchstart", (e) => {
            const touchX = e.touches[0].clientX;
            if (touchX < window.innerWidth / 2) {
                keys["ArrowLeft"] = true;
            } else {
                keys["ArrowRight"] = true;
            }
        });
        window.addEventListener("touchend", () => {
            keys["ArrowLeft"] = false;
            keys["ArrowRight"] = false;
        });

        // Reiniciar jogo
        restartBtn.addEventListener("click", () => {
            player.x = canvas.width / 2 - 15;
            obstacles = [];
            score = 0;
            obstacleSpeed = 4;
            gameActive = true;
            gameOverScreen.style.display = "none";
            scoreElement.innerText = score;
            gameLoop();
        });

        // Função para criar obstáculos (Pinheiros)
        function spawnObstacle() {
            if (Math.random() < spawnRate) {
                let size = Math.floor(Math.random() * 20) + 20; // Tamanhos variados
                let obstacle = {
                    x: Math.random() * (canvas.width - size),
                    y: canvas.height,
                    width: size,
                    height: size + 10
                };
                obstacles.push(obstacle);
            }
        }

        // Desenhar o Esquiador
        function drawPlayer() {
            // Desenhar os esquis
            ctx.fillStyle = "#ff4757";
            ctx.fillRect(player.x, player.y + 25, 6, 10);
            ctx.fillRect(player.x + player.width - 6, player.y + 25, 6, 10);

            // Desenhar o corpo do esquiador (azul)
            ctx.fillStyle = "#2e86de";
            ctx.fillRect(player.x + 5, player.y + 5, player.width - 10, 20);

            // Desenhar o capacete (amarelo)
            ctx.fillStyle = "#feca57";
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y + 5, 6, 0, Math.PI * 2);
            ctx.fill();
        }

        // Desenhar os Obstáculos (Pinheiros)
        function drawObstacles() {
            obstacles.forEach(obs => {
                ctx.fillStyle = "#10ac84"; // Verde árvore
                ctx.beginPath();
                ctx.moveTo(obs.x + obs.width / 2, obs.y);
                ctx.lineTo(obs.x, obs.y + obs.height);
                ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                ctx.closePath();
                ctx.fill();

                // Tronco da árvore
                ctx.fillStyle = "#57606f";
                ctx.fillRect(obs.x + (obs.width / 2) - 3, obs.y + obs.height, 6, 5);
            });
        }

        // Verificar colisões usando caixas delimitadoras (AABB)
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Atualizar posições e lógica do jogo
        function update() {
            if (!gameActive) return;

            // Movimentação do jogador
            if (keys["ArrowLeft"] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys["ArrowRight"] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Gerar e mover obstáculos (eles sobem para simular que o esquiador está descendo)
            spawnObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y -= obstacleSpeed; // Obstáculos se movem para cima

                // Checar colisão
                if (checkCollision(player, obstacles[i])) {
                    gameActive = false;
                    endGame();
                }

                // Remove obstáculos que saíram da tela e pontua
                if (obstacles[i].y + obstacles[i].height < 0) {
                    obstacles.splice(i, 1);
                    score++;
                    scoreElement.innerText = score;

                    // Aumentar a dificuldade gradualmente
                    if (score % 10 === 0) {
                        obstacleSpeed += 0.5;
                    }
                }
            }
        }

        function endGame() {
            finalScoreElement.innerText = score;
            gameOverScreen.style.display = "block";
        }

        // Loop principal do jogo
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Linhas de neve decorativas para dar sensação de velocidade
            ctx.strokeStyle = "#dff9fb";
            ctx.lineWidth = 2;
            for(let i=0; i<5; i++) {
                ctx.beginPath();
                ctx.moveTo(80 * i, 0);
                ctx.lineTo(80 * i, canvas.height);
                ctx.stroke();
            }

            update();
            drawPlayer();
            drawObstacles();

            if (gameActive) {
                requestAnimationFrame(gameLoop);
            }
        }

        // Iniciar pela primeira vez
        gameLoop();
    </script>
</body>
</html>
