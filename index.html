<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqui Alpino Ultra Pro ⛷️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #d2e4f7;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #uiContainer {
            display: flex;
            justify-content: space-between;
            width: 800px;
            max-width: 100%;
            padding: 10px 15px;
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }
        .ui-box {
            background: rgba(255, 255, 255, 0.6);
            padding: 5px 12px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        #gameCanvas {
            background: #f7f9fa;
            border: 4px solid #1a252f;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            display: block;
            max-width: 100%;
        }
        #gameOverScreen {
            display: none;
            position: absolute;
            background: rgba(255, 255, 255, 0.96);
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 2px solid #e74c3c;
            z-index: 20;
        }
        #gameOverScreen h1 {
            color: #c0392b;
            margin-bottom: 10px;
            font-size: 32px;
        }
        #gameOverScreen p {
            font-size: 18px;
            color: #34495e;
            margin-bottom: 15px;
        }
        #restartBtn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        #restartBtn:hover {
            background-color: #219653;
            transform: translateY(-2px);
        }
        .controls-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #556270;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="uiContainer">
        <div class="ui-box">Distância: <span id="score">0</span>m</div>
        <div class="ui-box">⭐ Recorde: <span id="highScore">0</span>m</div>
        <div class="ui-box">🪙 Moedas: <span id="coinsDisplay">0</span></div>
        <div class="ui-box">⚡ <span id="speedDisplay">40</span> km/h</div>
    </div>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="gameOverScreen">
        <h1>Acidente na Pista! 💥</h1>
        <p>Você colidiu contra os pinheiros da montanha.</p>
        <p>Percurso Total: <span id="finalScore">0</span> metros</p>
        <p>Moedas Coletadas: <span id="finalCoins">0</span></p>
        <button id="restartBtn">Jogar Novamente</button>
    </div>

    <div class="controls-hint">Use as setas ⬅️ ➡️ do teclado ou toque nas laterais da tela para desviar.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highScore");
        const coinsDisplayElement = document.getElementById("coinsDisplay");
        const speedDisplayElement = document.getElementById("speedDisplay");
        const finalScoreElement = document.getElementById("finalScore");
        const finalCoinsElement = document.getElementById("finalCoins");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const restartBtn = document.getElementById("restartBtn");

        // Física e Jogador
        let player = {
            x: canvas.width / 2,
            y: 120,
            width: 24,
            height: 38,
            vx: 0,
            maxSpeed: 7.5,
            friction: 0.86,
            accel: 0.65,
            angle: 0
        };

        let obstacles = [];
        let coins = [];
        let skiTracks = [];   
        let blizzardParticles = []; // Partículas da nevasca ativa
        let leavesParticles = []; 
        let score = 0;
        let coinsCount = 0;
        let highScore = localStorage.getItem("skiHighScore") || 0;
        let gameActive = true;
        let worldSpeed = 4.5;
        let maxWorldSpeed = 13;
        let spawnRateTree = 0.04;
        let spawnRateCoin = 0.02;
        let keys = {};

        highScoreElement.innerText = highScore;

        // Gerar flocos para a nevasca de fundo dinâmica
        for(let i = 0; i < 60; i++) {
            blizzardParticles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.5 + 0.5,
                drift: Math.random() * 1.5 - 0.5, // Caimento levemente diagonal
                speed: Math.random() * 3 + 2
            });
        }

        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        // Controles de toque móvel
        window.addEventListener("touchstart", (e) => {
            const touchX = e.touches.clientX;
            if (touchX < window.innerWidth / 2) keys["ArrowLeft"] = true;
            else keys["ArrowRight"] = true;
        });
        window.addEventListener("touchend", () => {
            keys["ArrowLeft"] = false;
            keys["ArrowRight"] = false;
        });

        restartBtn.addEventListener("click", () => {
            player.x = canvas.width / 2;
            player.vx = 0;
            player.angle = 0;
            obstacles = [];
            coins = [];
            skiTracks = [];
            leavesParticles = [];
            score = 0;
            coinsCount = 0;
            worldSpeed = 4.5;
            gameActive = true;
            gameOverScreen.style.display = "none";
            scoreElement.innerText = score;
            coinsDisplayElement.innerText = coinsCount;
            gameLoop();
        });

        function spawnElements() {
            // Gerar Árvores
            if (Math.random() < spawnRateTree) {
                let size = Math.floor(Math.random() * 20) + 35;
                obstacles.push({
                    x: Math.random() * (canvas.width - size),
                    y: canvas.height + 50,
                    width: size,
                    height: size * 1.3,
                    shake: 0
                });
            }
            // Gerar Moedas
            if (Math.random() < spawnRateCoin) {
                coins.push({
                    x: Math.random() * (canvas.width - 20) + 10,
                    y: canvas.height + 30,
                    radius: 8,
                    pulse: 0
                });
            }
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 15; i++) {
                leavesParticles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - 3,
                    radius: Math.random() * 4 + 2,
                    alpha: 1
                });
            }
        }

        function drawEnvironment() {
            // Renderiza e esmaece os rastros de esqui na pista de neve
            ctx.strokeStyle = "rgba(195, 215, 235, 0.4)";
            ctx.lineWidth = 3;
            skiTracks.forEach(t => {
                ctx.beginPath();
                ctx.moveTo(t.x1, t.y);
                ctx.lineTo(t.x1, t.y - worldSpeed);
                ctx.moveTo(t.x2, t.y);
                ctx.lineTo(t.x2, t.y - worldSpeed);
                ctx.stroke();
                t.y -= worldSpeed;
            });
            skiTracks = skiTracks.filter(t => t.y > 0);

            // Desenhar Moedas de Ouro
            coins.forEach(c => {
                c.pulse += 0.1;
                let sizeMod = Math.sin(c.pulse) * 1.5; // Efeito brilhante/pulsante

                ctx.save();
                ctx.shadowBlur = 6;
                ctx.shadowColor = "#f1c40f";
                ctx.fillStyle = "#f1c40f";
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius + sizeMod, 0, Math.PI * 2);
                ctx.fill();

                // Borda interna brilhante
                ctx.strokeStyle = "#f39c12";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(c.x, c.y, (c.radius + sizeMod) * 0.6, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            });
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);

            // Sombra do jogador
            ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
            ctx.beginPath();
            ctx.ellipse(0, 12, 10, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Esquis
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(-7, -15, 3, 32);
            ctx.fillRect(4, -15, 3, 32);

            // Corpo / Jaqueta
            ctx.fillStyle = "#1b3a4b"; 
            ctx.fillRect(-5, -6, 10, 16);

            // Braços/Bastões
            ctx.strokeStyle = "#95a5a6";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-7, 2); ctx.lineTo(-10, 14);
            ctx.moveTo(7, 2); ctx.lineTo(12, 14);
                            ctx.stroke
                                    
                                    }
